<style>

/* Phones and narrow tablets: roomy card, smaller balanced headline, nothing touches the edges */
@media (max-width: 760px) {

/* ---- Timing ---- */
.board { z-index: 20; pointer-events: none; }

@media (prefers-reduced-motion: no-preference) {
  .board.go .st { animation: settle .9s linear both !important; animation-delay: var(--d) !important; }
  .board.go.instant .st { animation: none !important; }
  .note { animation: cardIn .6s cubic-bezier(.2,.8,.2,1) both; }
  .lost { animation: rise .7s cubic-bezier(.2,.8,.2,1) .25s both; }
  .note .k { animation: rise .5s ease-out 1.1s both; }
  .note h1 { animation: rise .6s ease-out 2s both; }
  .note h1 em { animation: rise .5s ease-out 2.8s both; display: inline-block; }

  @keyframes fadeIn { from { opacity: 0; } }

  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }

@media (prefers-reduced-motion: reduce) { .board { z-index: 0; } }

/* Sticker landing: drops in, a soft overshoot, then eases gently to rest */
@keyframes settle {
  0%   { opacity: 0; transform: translate(-50%,-50%) rotate(calc(var(--r) - 6deg)) scale(.82); animation-timing-function: cubic-bezier(.25,.8,.35,1); }
  35%  { opacity: 1; }
  60%  { transform: translate(-50%,-50%) rotate(calc(var(--r) + 1deg)) scale(1.02); animation-timing-function: cubic-bezier(.45,0,.25,1); }

<body>
<div class="board" id="board" aria-hidden="true"></div>
<main class="note">
  <img class="lost" alt="John Travolta looking around, confused" src="stickers/travolta.webp">
  <div class="note-tx">
  <span class="k">Looking for something?</span>
  <h1>The demo that lived here found a team that <em>said yes.</em></h1>
  <p>It's doing great. It sends photos.</p>
  </div>
</main>
<script>
(() => {
  const IMGS = ["stickers/kitten-01.webp", "stickers/kitten-02.webp", "stickers/kitten-03.webp", "stickers/kitten-04.webp", "stickers/kitten-05.webp", "stickers/kitten-06.webp", "stickers/kitten-07.webp", "stickers/kitten-08.webp", "stickers/kitten-09.webp", "stickers/kitten-10.webp", "stickers/kitten-11.webp", "stickers/kitten-12.webp", "stickers/kitten-13.webp", "stickers/kitten-14.webp", "stickers/kitten-15.webp", "stickers/kitten-16.webp"];
  const board = document.getElementById('board');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // Timeline: card + Travolta first, then the copy, then (after reading time) stickers cover everything
  const READ_MS = 6800, STEP_MS = 55, FILL_MS = 4500;
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  function lay() {
    board.innerHTML = ''; seed = 7;
    const W = board.clientWidth, H = board.clientHeight;
    const size = Math.max(110, Math.min(190, W / 8));
    const cols = Math.ceil(W / (size * 0.58)), rows = Math.ceil(H / (size * 0.52));
    const cells = [];
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) cells.push([r, c]);
    // shuffle so stickers land in a random order
    for (let k = cells.length - 1; k > 0; k--) { const m = Math.floor(rnd() * (k + 1)); [cells[k], cells[m]] = [cells[m], cells[k]]; }
    cells.forEach(([r, c], n) => {
      const img = new Image();
      img.className = 'st'; img.alt = ''; img.decoding = 'async';
      img.src = IMGS[n % IMGS.length];
      const x = (c + 0.5 + (rnd() - 0.5) * 0.6) / cols * W, y = (r + 0.5 + (rnd() - 0.5) * 0.6) / rows * H;
      img.style.cssText = `left:${x}px;top:${y}px;--w:${Math.round(size * (0.85 + rnd() * 0.45))}px;--r:${Math.round((rnd() - 0.5) * 36)}deg;--d:${Math.round(n * Math.min(STEP_MS, FILL_MS / cells.length))}ms;z-index:${n}`;
      board.append(img);
    });
  }
  lay();
  if (reduce) board.classList.add('go');
  else setTimeout(() => board.classList.add('go'), READ_MS);
  let t; addEventListener('resize', () => { clearTimeout(t); t = setTimeout(() => { const go = board.classList.contains('go'); lay(); if (go) board.classList.add('go', 'instant'); }, 200); });
})();
</script>
